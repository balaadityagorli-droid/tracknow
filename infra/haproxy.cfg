global
  maxconn 20000
  log stdout format raw local0

defaults
  log global
  mode http
  option httplog
  option dontlognull
  option forwardfor
  option http-server-close
  timeout connect 3s
  timeout client  60s
  timeout server  60s
  timeout tunnel  3600s   # keep WebSocket tunnels open

frontend http_in
  bind *:8080
  default_backend app_nodes

  # WebSocket upgrade detection (HAProxy tunnels them transparently in mode http)
  acl is_ws hdr(Upgrade) -i WebSocket
  use_backend app_nodes if is_ws

backend app_nodes
  balance roundrobin
  option httpchk GET /api/health
  http-check expect status 200

  # Sessions must stick while the WebSocket is open; use source IP affinity
  # (cookie-based stickiness is better for real deployments but needs app changes)
  stick-table type ip size 100k expire 30m
  stick on src

  server app1 app1:3001 check inter 1500ms fall 2 rise 2 maxconn 5000
  server app2 app2:3002 check inter 1500ms fall 2 rise 2 maxconn 5000

  # Remove a failed server from rotation but keep existing WS connections alive
  option redispatch
  retries 2
